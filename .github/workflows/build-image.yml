name: Build EclipseOS image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/BUILD_ONCE"

permissions:
  contents: read
  actions: read

concurrency:
  group: moonlight-os-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static validation
        run: bash ./scripts/validate.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Select build or validation recovery
        id: mode
        run: |
          RUN_ID=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            RUN_ID=$(sed -n 's/^REVALIDATE_RUN_ID=\([0-9][0-9]*\)$/\1/p' .github/BUILD_ONCE)
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Recover the previously installed raw image
        if: steps.mode.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: moonlight-os-unvalidated-raw
          path: out
          github-token: ${{ github.token }}
          run-id: ${{ steps.mode.outputs.run_id }}
      - name: Decompress recovered image
        if: steps.mode.outputs.run_id != ''
        run: |
          if [ -f out/moonlight-os-mbp14-1.img.xz ]; then
            xz -dk out/moonlight-os-mbp14-1.img.xz
          else
            # Legacy recovery artifacts retain their old filename.
            xz -dk out/moonlight-os-mbp14-1.raw.xz
          fi
      - name: Enable KVM when available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Build Fedora 44 UEFI disk image
        run: |
          set -o pipefail
          mkdir -p out
          KVM_ARG=""
          if [ -e /dev/kvm ]; then KVM_ARG="--device=/dev/kvm"; fi
          docker run --rm --privileged $KVM_ARG \
            -e VALIDATION_RUN_ID="${{ steps.mode.outputs.run_id }}" \
            -v "$PWD:/workspace" -w /workspace \
            fedora:44 bash -euxo pipefail -c '
              dnf -y install lorax-lmc-virt qemu-kvm qemu-img edk2-ovmf curl xz util-linux findutils xfsprogs e2fsprogs dosfstools pykickstart dracut &&
              ksvalidator ./config/moonlight-os.ks &&
              if [ -n "$VALIDATION_RUN_ID" ]; then
                bash ./scripts/build-image.sh --validate-only
              else
                bash ./scripts/build-image.sh
              fi
            ' 2>&1 | tee out/image-build.log
      - name: Preserve installed image after a validation failure
        if: failure()
        run: |
          if [ -f out/moonlight-os-mbp14-1.img ] && [ -f out/build-inputs.sha256 ] && [ ! -f out/moonlight-os-mbp14-1.img.xz ]; then
            sudo xz -T2 -1 out/moonlight-os-mbp14-1.img
          fi
      - name: Upload unvalidated recovery image
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-os-unvalidated-raw
          path: |
            out/moonlight-os-mbp14-1.img.xz
            out/build-inputs.sha256
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3
      - name: Show installer failure log
        if: failure()
        run: |
          echo "===== virt-install.log ====="
          if [ -f virt-install.log ]; then
            tail -n 400 virt-install.log
          else
            echo "virt-install.log was not produced"
          fi
          echo "===== lmc files ====="
          find out/lmc -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-os-build-failure-logs
          path: |
            virt-install.log
            out/lmc/**
            out/ovmf-*.log
            out/boot-diagnostic*.log
            out/image-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-os-mbp14-1
          path: |
            out/moonlight-os-mbp14-1.img.xz
            out/moonlight-os-mbp14-1.img.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
