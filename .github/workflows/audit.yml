name: Audit Moonlight-OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonlight-os-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fedora OVMF tool and firmware preflight
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace fedora:44 \
            bash -euc 'dnf -y install qemu-kvm qemu-img edk2-ovmf && bash scripts/test-ovmf.sh --check-tools'

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell and repository validation
        run: bash ./scripts/validate.sh

  fedora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fedora 44 Kickstart and package audit
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace fedora:44 \
            bash ./scripts/audit-packages.sh


  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fedora 44 Cirrus audio compile audit
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace fedora:44 \
            bash ./scripts/audit-audio.sh
