name: Audit Moonlight-OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonlight-os-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disposable GPT and XFS first-boot growth audit
        run: docker run --rm --privileged -v "$PWD:/workspace:ro" -w /workspace fedora:44 bash scripts/audit-root-growth.sh

  image-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fedora OVMF tool and firmware preflight
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace fedora:44 \
            bash -euc 'dnf -y install qemu-kvm qemu-img edk2-ovmf && bash scripts/test-ovmf.sh --check-tools'

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell and repository validation
        run: |
          bash ./scripts/validate.sh
          python3 ./scripts/audit-runtime.py

  fedora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fedora 44 Kickstart and package audit
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace fedora:44 \
            bash -euc 'bash ./scripts/audit-packages.sh && bash ./scripts/audit-frontends.sh'


  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fedora 44 Cirrus audio compile audit
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace fedora:44 \
            bash ./scripts/audit-audio.sh

  boot-animation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fedora Plymouth native theme and offline payload audit
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace fedora:44 \
            bash scripts/audit-boot-animation.sh --install-tools
